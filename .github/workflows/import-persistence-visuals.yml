name: Import persistence-system visuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-assets:
    if: contains(github.event.head_commit.message, 'stage persistence visual import')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download approved persistence visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/persistence-system/bibles
          mkdir -p assets/persistence-system/reviews
          mkdir -p assets/persistence-system/loss-scenarios

          download_png() {
            local url="$1"
            local path="$2"
            echo "Downloading ${path}"
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 -o "$path" "$url"
            file "$path" | grep -q 'PNG image data'
          }

          download_png 'https://at.adobe.com/3QzLGD5aVMmozLub' 'assets/persistence-system/bibles/00-primary-persistence-system-bible.png'
          download_png 'https://at.adobe.com/1H6adf43Z6VghB9M' 'assets/persistence-system/bibles/01-detailed-persistence-system-bible.png'
          download_png 'https://at.adobe.com/VgN2Y2l7dKics9Kf' 'assets/persistence-system/bibles/02-two-page-persistence-system-bible.png'
          download_png 'https://at.adobe.com/KX1ZSIcUy8vvupGq' 'assets/persistence-system/reviews/slide-montage.png'
          download_png 'https://at.adobe.com/Yn6EF5zaHU5S5par' 'assets/persistence-system/reviews/pdf-montage.png'

          download_png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:66a0ccb2-f13e-4b8f-96fb-02c923886c04' 'assets/persistence-system/loss-scenarios/01-engine-load-imbalance.png'
          download_png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:41f0a9a4-b702-4bc9-801c-18be46b40ef7' 'assets/persistence-system/loss-scenarios/02-rain-road-crash.png'
          download_png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:1ca1a42c-cf3e-4c4e-89ee-1bc27ea17fb1' 'assets/persistence-system/loss-scenarios/03-ridge-exposure.png'
          download_png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:dd95892d-0b7b-4046-ac42-a85a92290e94' 'assets/persistence-system/loss-scenarios/04-wrong-accusation-consequence.png'

          test "$(find assets/persistence-system -type f -name '*.png' | wc -l)" -eq 9

      - name: Add visual indexes
        shell: bash
        run: |
          cat > assets/persistence-system/README.md <<'EOF'
          # Persistence System Visuals

          These PNG files support the Redemption Windows and Second Roads design.

          ## Bibles

          The `bibles/` directory contains three visual explanations of the Persistence System.

          - `00-primary-persistence-system-bible.png` is the primary visual summary.
          - `01-detailed-persistence-system-bible.png` is the portrait reference board.
          - `02-two-page-persistence-system-bible.png` is the landscape reference board.

          ## Review images

          The `reviews/` directory contains slide and PDF review montages.

          ## Loss scenarios

          The `loss-scenarios/` directory contains four gameplay concept frames:

          1. Engine-load imbalance.
          2. Rain-road crash.
          3. Ridge exposure.
          4. Wrong-accusation consequence.

          These frames establish action, risk, persistent loss, and possible Redemption Seeds.

          Generated interface text is exploratory. It does not override the canonical control, HUD, loss, or Persistence System documents.

          See `docs/design/REDEMPTION_WINDOWS_AND_SECOND_ROADS_BIBLE.md` and `source/redemption-window-ledger.csv`.
          EOF

          cat > assets/persistence-system/loss-scenarios/README.md <<'EOF'
          # Loss-Scenario Concept Frames

          These images prove that the game can show failure before, during, and after the decisive action.

          Each frame should communicate:

          - the immediate objective,
          - the readable threat,
          - the available response,
          - the possible defeat,
          - the persistent consequence,
          - and any hidden Redemption Seed.

          The images are previsualization targets. They do not represent an engine build.

          Generated HUD wording is not canonical. Use the design specifications for implementation copy.
          EOF

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/persistence-system
          git commit -m 'assets: add Persistence System bibles and loss scenarios'
          git push
