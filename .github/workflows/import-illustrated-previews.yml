name: Refresh illustrated preview links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-links:
    if: contains(github.event.head_commit.message, 'refresh illustrated preview links')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace legacy SVG references
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#assets/previews/world-overview\.svg#assets/previews/world-overview.png#g' README.md
          sed -i 's#assets/previews/systems-overview\.svg#assets/previews/systems-overview.png#g' README.md
          sed -i 's#assets/previews/storyboard-overview\.svg#assets/previews/storyboard-overview.png#g' README.md
          sed -i 's#assets/previews/systems-overview\.svg#assets/previews/systems-overview.png#g' packages/playable-vision/gameplay-systems/README.md
          sed -i 's#assets/previews/storyboard-overview\.svg#assets/previews/storyboard-overview.png#g' packages/playable-vision/opening-storyboard/README.md

      - name: Add illustrated card-board links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text()
          old = """3. View the [world overview](assets/previews/world-overview.png).\n4. View the [systems overview](assets/previews/systems-overview.png).\n5. View the [opening-slice overview](assets/previews/storyboard-overview.png)."""
          new = """3. View the [location cards](assets/previews/world-overview.png).\n4. View the [character cards](assets/previews/character-cards.png).\n5. View the [systems overview](assets/previews/systems-overview.png).\n6. View the [encounter cards](assets/previews/encounter-cards.png).\n7. View the [worldview cards](assets/previews/worldview-cards.png).\n8. View the [relationship-state cards](assets/previews/relationship-state-cards.png).\n9. View the [gameplay keyframes](assets/previews/storyboard-overview.png)."""
          if old in text:
              text = text.replace(old, new)
          root.write_text(text)

          card = Path('packages/card-library/README.md')
          text = card.read_text()
          marker = "## Visual rule\n"
          block = """## Rendered preview boards\n\n- `assets/previews/character-cards.png`\n- `assets/previews/world-overview.png`\n- `assets/previews/systems-overview.png`\n- `assets/previews/encounter-cards.png`\n- `assets/previews/worldview-cards.png`\n- `assets/previews/relationship-state-cards.png`\n- `assets/previews/storyboard-overview.png`\n\nThese images support rapid review. They do not replace the canonical records.\n\n"""
          if block not in text and marker in text:
              text = text.replace(marker, block + marker)
          card.write_text(text)
          PY

      - name: Commit documentation refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md packages/playable-vision/gameplay-systems/README.md packages/playable-vision/opening-storyboard/README.md packages/card-library/README.md
          git commit -m 'docs: point reviews to illustrated PNG boards'
          git push
