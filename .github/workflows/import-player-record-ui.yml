name: Import player-record UI visuals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-assets:
    if: contains(github.event.head_commit.message, 'stage player record UI import')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download approved Player Record visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/player-record-ui

          download_png() {
            local url="$1"
            local path="$2"
            echo "Downloading ${path}"
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 240 -o "$path" "$url"
            file "$path" | grep -q 'PNG image data'
          }

          download_png 'https://at.adobe.com/WKUvKy4Sn65XCVCo' 'assets/player-record-ui/00-player-record-ui-overview.png'
          download_png 'https://at.adobe.com/57wh1t8EaIsTsn6j' 'assets/player-record-ui/01-encounter-scorecard.png'
          download_png 'https://at.adobe.com/Dhv8mZRvZCihsJZS' 'assets/player-record-ui/02-mastery-roadbook.png'
          download_png 'https://at.adobe.com/x3gnjh8PsPTVOq9S' 'assets/player-record-ui/03-living-history-entry.png'
          download_png 'https://at.adobe.com/w3CGb2fwu9K0Zdjk' 'assets/player-record-ui/04-challenge-board.png'
          download_png 'https://at.adobe.com/OPgeljJYhArnna7o' 'assets/player-record-ui/05-journey-score.png'
          download_png 'https://at.adobe.com/Bj7jpwDrq9KeiccW' 'assets/player-record-ui/06-legacy-card.png'

          test "$(find assets/player-record-ui -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 7

      - name: Add visual index
        shell: bash
        run: |
          cat > assets/player-record-ui/README.md <<'EOF'
          # Player Record UI Proof Set

          These PNG files show the player-facing Living Record and Roadbook systems.

          ## Files

          - `00-player-record-ui-overview.png` shows the complete six-screen set.
          - `01-encounter-scorecard.png` separates craft score from practical outcome.
          - `02-mastery-roadbook.png` shows capability tiers and mastery proofs.
          - `03-living-history-entry.png` shows competing accounts and causal history.
          - `04-challenge-board.png` separates Canon Marks from replay Best Marks.
          - `05-journey-score.png` shows the optional act-level score.
          - `06-legacy-card.png` summarizes one completed playthrough.

          These images are previsualization targets. They do not represent an engine build.

          Canonical rules remain in `docs/design/PLAYER_RECORD_MASTERY_HISTORY_AND_LEGACY_BIBLE.md`.
          EOF

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/player-record-ui
          git commit -m 'assets: add Player Record and Roadbook UI proof set'
          git push
