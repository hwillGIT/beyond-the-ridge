name: Import motion study PNGs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-motion-studies:
    if: contains(github.event.head_commit.message, 'motion study import')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download motion study boards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/motion-studies
          download() {
            local url="$1"
            local file="$2"
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 -o "assets/motion-studies/$file" "$url"
            file "assets/motion-studies/$file" | grep -q 'PNG image data'
          }
          download 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:d024821c-076d-46d9-81c8-9f1982162693' '00-mara-vale-character-reference.png'
          download 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:b0a55779-7733-4a2a-b022-2a9decbba3e6' '01-axle-inspection.png'
          download 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:30a66e6a-fec5-41e2-94f0-4fc30295dbf4' '02-emergency-stop.png'
          download 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9ce1054b-73a6-49f9-9a79-ac11a049c9e4' '03-drive-and-talk.png'
          download 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:849f2252-0b57-4cda-bad3-ceac92732a99' '04-cedar-gate-navigation.png'
          download 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:7d7c72ac-94f3-4c18-a9c9-62d3c11ae2c6' '05-evidence-journal.png'
          download 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:9d2254ed-5879-4b0a-853e-486f3746aaf6' '06-college-threshold.png'
          test "$(find assets/motion-studies -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 7

      - name: Add motion study index
        shell: bash
        run: |
          cat > assets/motion-studies/README.md <<'EOF'
          # Motion Studies

          These PNG boards test six player actions before engine implementation.

          - `00-mara-vale-character-reference.png` is the current visual continuity anchor for Mara.
          - `01-axle-inspection.png` tests inspection and diagnosis.
          - `02-emergency-stop.png` tests readable machinery danger and interruption.
          - `03-drive-and-talk.png` tests simultaneous driving, observation, and conversation.
          - `04-cedar-gate-navigation.png` tests landmark-based town navigation.
          - `05-evidence-journal.png` tests analog evidence revision.
          - `06-college-threshold.png` tests learning unfamiliar institutional rules.

          See `docs/production/MOTION_STUDY_SPECS.md` for timing, interaction, and review requirements.

          These are previsualization studies. They do not represent an engine build.
          EOF

      - name: Commit motion study assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/motion-studies
          git commit -m 'assets: add six gameplay motion studies and Mara reference'
          git push
