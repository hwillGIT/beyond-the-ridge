name: Import full UI gameplay frames

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-full-ui:
    if: contains(github.event.head_commit.message, 'full UI gameplay frame import')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download full UI frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/gameplay-ui/full-ui
          download() {
            local url="$1"
            local file="$2"
            echo "Downloading $file"
            curl -L --fail --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 180 -o "assets/gameplay-ui/full-ui/$file" "$url"
            file "assets/gameplay-ui/full-ui/$file" | grep -q 'PNG image data'
          }
          download 'https://at.adobe.com/Qj8r2psR7zDujrES' '03-hairline-crack-full-ui.png'
          download 'https://at.adobe.com/rfaVSGEJrRCb3ud3' '04-suspended-load-full-ui.png'
          download 'https://at.adobe.com/op3YPueGtb1Wj4rK' '05-mercy-house-full-ui.png'
          download 'https://at.adobe.com/OMQhVwVfIdxoD1Ow' '09-memory-journal-full-ui.png'
          test "$(find assets/gameplay-ui/full-ui -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 4

      - name: Add frame index
        shell: bash
        run: |
          cat > assets/gameplay-ui/README.md <<'EOF'
          # Gameplay UI Proof Frames

          This directory contains interaction-focused gameplay previsualization.

          The `full-ui` set proves control, task clarity, alternatives, pressure, and feedback for the four most complex systems:

          1. Hairline Crack repair.
          2. Suspended Load danger response.
          3. Mercy House care and referral.
          4. Memory Journal evidence review.

          These images are visual design targets. They do not represent an engine build.

          See `docs/design/GAMEPLAY_INTERACTION_AND_HUD_BIBLE.md` for the interaction contract.
          EOF

      - name: Commit imported frames
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gameplay-ui
          git commit -m 'assets: add four full UI gameplay proof frames'
          git push
