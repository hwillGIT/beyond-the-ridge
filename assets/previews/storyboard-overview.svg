<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Beyond the Ridge opening vertical slice</title>
<desc id="desc">A twelve-beat summary of the opening playable sequence.</desc>
<rect width="1200" height="420" fill="#122428"/>
<text x="50" y="52" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#f1e8d3">OPENING VERTICAL SLICE</text>
<text x="50" y="82" font-family="Arial, sans-serif" font-size="17" fill="#cdbf9c">Thirty-five to forty-five minutes of play. Twenty-eight full storyboard panels.</text>
<g font-family="Arial, sans-serif" font-size="14" fill="#17282a">
<g transform="translate(50,120)"><rect width="165" height="95" rx="8" fill="#e8ddc4"/><text x="15" y="28">1  Ridge dawn</text><text x="15" y="53">2  Breakfast</text><text x="15" y="78">3  Work assignment</text></g>
<g transform="translate(235,120)"><rect width="165" height="95" rx="8" fill="#d9c79f"/><text x="15" y="28">4  Hairline crack</text><text x="15" y="53">5  Pressure</text><text x="15" y="78">6  Load shifts</text></g>
<g transform="translate(420,120)"><rect width="165" height="95" rx="8" fill="#e8ddc4"/><text x="15" y="28">7  Treatment</text><text x="15" y="53">8  Conflicting memory</text><text x="15" y="78">9  Supply run</text></g>
<g transform="translate(605,120)"><rect width="165" height="95" rx="8" fill="#d9c79f"/><text x="15" y="28">10  Town encounter</text><text x="15" y="53">11  Meetinghouse</text><text x="15" y="78">12  Ridge signal</text></g>
<g transform="translate(790,120)"><rect width="165" height="95" rx="8" fill="#e8ddc4"/><text x="15" y="28">13  Return home</text><text x="15" y="53">14  Supper version</text><text x="15" y="78">15  Correct or silent</text></g>
<g transform="translate(975,120)"><rect width="165" height="95" rx="8" fill="#d9c79f"/><text x="15" y="28">16  Journal</text><text x="15" y="53">17  Hidden map</text><text x="15" y="78">18  Threshold</text></g>
</g>
<path d="M75 275 H1125" stroke="#9b6f38" stroke-width="4"/>
<text x="600" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#f1e8d3">What lies beyond the world you were given?</text>
<text x="600" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#cdbf9c">The full slice joins work, risk, care, town access, family interpretation, and memory.</text>
</svg>
