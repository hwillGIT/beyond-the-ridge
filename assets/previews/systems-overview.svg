<title id="title">Beyond the Ridge gameplay systems overview</title>
<desc id="desc">The core loop connects observation, work, disruption, choice, consequence, home, and reconsideration.</desc>
<rect width="1200" height="360" fill="#f2ead8"/>
<text x="55" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#14272a">GAMEPLAY SYSTEMS</text>
<text x="55" y="92" font-family="Arial, sans-serif" font-size="17" fill="#53615d">One loop connects physical work to human interpretation.</text>
